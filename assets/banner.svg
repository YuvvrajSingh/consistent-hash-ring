  <circle cx="946.9" cy="75.7" r="4" fill="#10B981" stroke="#09090b" stroke-width="1.5"/>
  <!-- Clockwise motion indicator -->
  <path d="M 1020.2 64.8 A 148 148 0 0 1 1082.7 117.2" fill="none" stroke="#71717a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1092.7" y="111.2" font-family="'Geist Mono', monospace" font-size="9" fill="#a1a1aa">clockwise &#x21B7;</text>
  <!-- Key resolution demonstration -->
  <circle cx="1082.3" cy="174.0" r="3.5" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5"/>
  <path d="M 1082.3 174.0 A 125 125 0 0 1 1084.3 213.1" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(1098.3, 150.0)">
    <rect width="112" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="8" y="15" font-family="'Geist Mono', 'SF Mono', monospace" font-size="9" fill="#f43f5e" font-weight="600">KEY: #4208</text>
    <text x="8" y="27" font-family="'Geist Mono', 'SF Mono', monospace" font-size="8.5" fill="#71717a">&#x2192; resolves to beta</text>
